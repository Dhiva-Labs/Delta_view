<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- DeltaView, concept 1 "Split Delta", bare glyph: one Δ in two tones. -->
  <defs>
    <clipPath id="left-half"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right-half"><rect x="512" y="0" width="512" height="1024"/></clipPath>
  </defs>
  <g clip-path="url(#left-half)">
    <polygon points="512,72 952,952 72,952" fill="#6366F1"/>
  </g>
  <g clip-path="url(#right-half)">
    <polygon points="512,72 952,952 72,952" fill="#A5B4FC"/>
  </g>
</svg>
