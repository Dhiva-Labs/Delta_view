# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (packaging/make_deb.sh).

NAME=delta-view              # package name, the same as the .deb's
APP_NAME=DeltaView           # AppImage file name and display name
GITHUB_REPO=Dhiva-Labs/Delta_view
TAG_PREFIX=''                # release tags are 1.1.0, without a v
SUMMARY='Compare and merge folders and files, Meld-style'
DESCRIPTION='DeltaView compares folders and files side by side and merges the differences: copy changes across, resolve three-way merges, and synchronize folders with a preview of every step. It compares local folders, zip and tar archives and SFTP servers, shows images and JSON, YAML and CSV by their structure, and works as git difftool and mergetool.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/Delta_view
LICENSE=MIT                  # SPDX id
LICENSE_FILE=LICENSE         # installed to /usr/share/licenses/<name>/; empty to skip

# The app lives in /opt/delta_view (an underscore, unlike the package name),
# so the package owns that directory as well as the ones named after it.
OWN_DIRS=(opt/delta_view)

# Files of the .deb tree that the other formats leave out. libdartjni.so
# comes from the jni plugin (an Android dependency); CMake builds it only
# because the CI runner has a JDK, and it links that runner's libjvm.so by
# absolute path. Nothing loads it on desktop Linux (the snap, built without
# a JDK, has no such file), and shipping it would make the rpm require a JVM.
EXCLUDE=(opt/delta_view/lib/libdartjni.so)

# rpm: shared-library dependencies are worked out from the ELF files. List
# only what the app runs (tools it executes), as file paths. "Open in file
# manager" and the About links go through xdg-open.
RPM_REQUIRES=(/usr/bin/xdg-open)
# Arch: package names, written by hand (Arch has no soname dependencies for
# most libraries). CI's ldd check on archlinux:latest keeps this honest.
ARCH_DEPENDS=(gtk3 xdg-utils)
ARCH_INDEPENDENT=0           # 1 for pure-Python/shell packages (noarch / any)

# AppImage (GUI apps): paths relative to the installed tree.
APPIMAGE=1
EXEC=opt/delta_view/delta_view
DESKTOP=usr/share/applications/com.dhivalabs.delta_view.desktop
ICON=usr/share/icons/hicolor/256x256/apps/delta-view.png
APPRUN_ENV=''                # /usr/bin/delta-view is a plain symlink, no env

# Smoke tests run in each distribution container by verify.sh.
# SMOKE_CMD runs under Xvfb (the Flutter runner opens the display before the
# Dart code prints the version) and its output must match SMOKE_EXPECT.
SMOKE_CMD='delta-view --version'
SMOKE_EXPECT='^DeltaView [0-9]'
# The GUI run starts the app on two folders, the way `git difftool
# --dir-diff` does. Within SMOKE_SECONDS it must show its window and record
# the comparison in its settings file: that file is written from Dart, and
# only for folders the app found, so the AOT code ran and could read them.
GUI_CMD=delta-view
GUI_ARGS='"$HOME/left" "$HOME/right"'
SMOKE_SETUP='mkdir -p "$HOME/left" "$HOME/right" && echo one > "$HOME/left/a.txt" && echo two > "$HOME/right/a.txt"'
SMOKE_READY='xdotool search --class delta_view > /dev/null && grep -qsF "\"$HOME/left\"" "$HOME/.local/share/com.dhivalabs.delta_view/settings.json"'
SMOKE_SECONDS=90
