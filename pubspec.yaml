publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.5.2
  dartssh2: ^4.1.0
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  highlight: ^0.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
